  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-spacing: normal;\n  text-transform: none;\n  display: inline-block;\n  white-space: nowrap;\n  word-wrap: normal;\n  direction: ltr;\n  -webkit-font-feature-settings: 'liga';\n  -webkit-font-smoothing: antialiased;\n}\n<\u002Fstyle>\n  <style>\n    * { box-sizing: border-box; }\n    html, body { margin: 0; }\n    body { background: #0b1437; }\n    ::-webkit-scrollbar { width: 8px; height: 8px; }\n    ::-webkit-scrollbar-track { background: transparent; }\n    ::-webkit-scrollbar-thumb { background: rgba(163,174,208,0.22); border-radius: 8px; }\n    @keyframes dashWinIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; background:radial-gradient(1200px 600px at 78% -8%, rgba(67,24,255,0.18), transparent 60%), #0b1437; font-family:'DM Sans', sans-serif; color:#ffffff; padding:22px 26px 30px; position:relative; overflow:hidden;\">\n\n  <!-- ============ TOP BAR ============ -->\n  <header style=\"display:flex; align-items:center; gap:20px; margin-bottom:20px;\">\n    <div style=\"display:flex; align-items:center; gap:13px; min-width:0;\">\n      <div style=\"width:42px; height:42px; border-radius:13px; background:linear-gradient(135deg,#7551FF,#4318FF); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(67,24,255,0.45); flex:0 0 auto;\">\n        <span style=\"font-family:'Material Symbols Rounded'; font-size:24px; line-height:1; color:#fff;\">hub<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"min-width:0;\">\n        <div style=\"font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#7a86b6; font-weight:600;\">EU Knowledge Graph&nbsp;&nbsp;/&nbsp;&nbsp;Dashboard<\u002Fdiv>\n        <div style=\"font-size:24px; font-weight:700; letter-spacing:-.02em; line-height:1.15;\">Portfolio Dashboard<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1 1 auto;\"><\u002Fdiv>\n\n    <div style=\"display:flex; align-items:center; gap:9px; background:#111c44; border:1px solid rgba(163,174,208,0.12); border-radius:30px; padding:9px 16px; width:300px; color:#8a96c6;\">\n      <span style=\"font-family:'Material Symbols Rounded'; font-size:19px; line-height:1; color:#7a86b6;\">search<\u002Fspan>\n      <span style=\"font-size:13.5px; color:#7a86b6;\">Search calls, topics, organisations…<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; align-items:center; gap:6px;\">\n      <div style=\"position:relative; width:42px; height:42px; border-radius:50%; background:#111c44; border:1px solid rgba(163,174,208,0.12); display:flex; align-items:center; justify-content:center; cursor:pointer;\">\n        <span style=\"font-family:'Material Symbols Rounded'; font-size:21px; line-height:1; color:#a3aed0;\">star<\u002Fspan>\n        <span style=\"position:absolute; top:7px; right:7px; width:8px; height:8px; border-radius:50%; background:#FBBF24; border:2px solid #0b1437;\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width:42px; height:42px; border-radius:50%; background:#111c44; border:1px solid rgba(163,174,208,0.12); display:flex; align-items:center; justify-content:center; cursor:pointer;\">\n        <span style=\"font-family:'Material Symbols Rounded'; font-size:20px; line-height:1; color:#a3aed0;\">info<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,#01ADC4,#22C55E); display:flex; align-items:center; justify-content:center; margin-left:2px; font-weight:700; font-size:14px;\">AU<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ============ KPI TILES ============ -->\n  <div style=\"display:grid; grid-template-columns:repeat(6,1fr); gap:16px; margin-bottom:18px;\">\n    <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"6\">\n      <div style=\"background:#111c44; border:1px solid rgba(163,174,208,0.06); border-radius:20px; padding:14px 15px; display:flex; align-items:center; gap:12px; min-width:0;\">\n        <div style=\"width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; background:{{ k.tint }};\">\n          <span style=\"font-family:'Material Symbols Rounded'; font-size:24px; line-height:1; color:{{ k.tone }};\">{{ k.icon }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"min-width:0;\">\n          <div style=\"font-size:12px; color:#a3aed0; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ k.label }}<\u002Fdiv>\n          <div style=\"font-size:22px; font-weight:700; letter-spacing:-.02em; line-height:1.2;\">{{ k.value }}<\u002Fdiv>\n          <div style=\"font-size:11px; color:#5f6b9c; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ k.sub }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- ============ THEME TOGGLE BAR ============ -->\n  <div style=\"display:flex; align-items:center; gap:14px; background:#0d1a40; border:1px solid rgba(163,174,208,0.08); border-radius:18px; padding:11px 16px; margin-bottom:18px;\">\n    <div style=\"display:flex; align-items:center; gap:9px; padding-right:14px; border-right:1px solid rgba(163,174,208,0.12); flex:0 0 auto;\">\n      <span style=\"font-family:'Material Symbols Rounded'; font-size:20px; line-height:1; color:{{ accent }};\">dashboard_customize<\u002Fspan>\n      <span style=\"font-size:13px; font-weight:600; color:#cdd5ef;\">Explore by theme<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:9px; flex:1 1 auto; flex-wrap:wrap;\">\n      <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"6\">\n        <button type=\"button\" onclick=\"{{ t.onToggle }}\" style=\"{{ t.btnStyle }}\">\n          <span style=\"font-family:'Material Symbols Rounded'; font-size:18px; line-height:1;\">{{ t.icon }}<\u002Fspan>\n          <span>{{ t.label }}<\u002Fspan>\n          <span style=\"font-family:'Material Symbols Rounded'; font-size:16px; line-height:1; opacity:.7;\">{{ t.chev }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ MAIN AREA ============ -->\n  <div style=\"display:grid; grid-template-columns:1.62fr 1fr; gap:18px; align-items:start;\">\n\n    <!-- Open / upcoming calls list -->\n    <div style=\"background:#111c44; border:1px solid rgba(163,174,208,0.06); border-radius:20px; padding:20px 22px 12px;\">\n      <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:6px;\">\n        <div style=\"min-width:0; flex:1 1 auto;\">\n          <div style=\"font-size:17px; font-weight:700; letter-spacing:-.01em;\">Open &amp; upcoming calls<\u002Fdiv>\n          <div style=\"font-size:12px; color:#5f6b9c; margin-top:1px;\">Sorted by deadline · {{ callCountLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:7px;\">\n          <sc-for list=\"{{ callFilters }}\" as=\"f\" hint-placeholder-count=\"3\">\n            <button type=\"button\" onclick=\"{{ f.onClick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:1fr auto auto auto; gap:0 14px; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:#5a659a; font-weight:600; padding:10px 8px 8px; border-bottom:1px solid rgba(163,174,208,0.08);\">\n        <div>Call<\u002Fdiv><div style=\"text-align:right;\">Budget<\u002Fdiv><div style=\"text-align:center;\">Deadline<\u002Fdiv><div style=\"text-align:right;\">Status<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <sc-for list=\"{{ calls }}\" as=\"c\" hint-placeholder-count=\"7\">\n          <div style=\"display:grid; grid-template-columns:1fr auto auto auto; gap:0 14px; align-items:center; padding:11px 8px; border-bottom:1px solid rgba(163,174,208,0.05);\">\n            <div style=\"display:flex; align-items:center; gap:11px; min-width:0;\">\n              <span style=\"width:9px; height:9px; border-radius:50%; flex:0 0 auto; background:{{ c.color }}; box-shadow:0 0 0 3px {{ c.glow }};\"><\u002Fspan>\n              <div style=\"min-width:0;\">\n                <div style=\"font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ c.title }}<\u002Fdiv>\n                <div style=\"font-size:11px; color:#6b76a8; font-family:'DM Sans'; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ c.id }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13px; font-weight:700; text-align:right; color:#e6e9f5; font-variant-numeric:tabular-nums;\">{{ c.budget }}<\u002Fdiv>\n            <div style=\"text-align:center; min-width:78px;\">\n              <div style=\"font-size:12.5px; font-weight:600; color:#cdd5ef;\">{{ c.deadline }}<\u002Fdiv>\n              <div style=\"font-size:10.5px; color:#5f6b9c;\">{{ c.progLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align:right;\">\n              <span style=\"display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:4px 9px; border-radius:20px; color:{{ c.statusColor }}; background:{{ c.statusBg }};\">\n                <span style=\"width:6px; height:6px; border-radius:50%; background:{{ c.statusColor }};\"><\u002Fspan>{{ c.statusLabel }}\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Right column: research tools + calls over time -->\n    <div style=\"display:flex; flex-direction:column; gap:18px; min-width:0;\">\n    <!-- Research tools panel -->\n    <div style=\"background:#111c44; border:1px solid rgba(163,174,208,0.06); border-radius:20px; padding:18px 18px 16px;\">\n      <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:14px;\">\n        <span style=\"font-family:'Material Symbols Rounded'; font-size:20px; line-height:1; color:{{ accent }};\">construction<\u002Fspan>\n        <span style=\"font-size:15px; font-weight:700;\">Research tools<\u002Fspan>\n        <span style=\"margin-left:auto; font-size:11px; color:#5f6b9c;\">CORDIS evidence<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; gap:6px; background:#0d1a40; border-radius:13px; padding:5px; margin-bottom:15px;\">\n        <sc-for list=\"{{ toolTabs }}\" as=\"tt\" hint-placeholder-count=\"3\">\n          <button type=\"button\" onclick=\"{{ tt.onClick }}\" style=\"{{ tt.style }}\">\n            <span style=\"font-family:'Material Symbols Rounded'; font-size:17px; line-height:1;\">{{ tt.icon }}<\u002Fspan>\n            <span>{{ tt.label }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- Research fields tab -->\n      <sc-if value=\"{{ toolIsFields }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"font-size:12px; color:#7a86b6; margin-bottom:12px;\">Calls funded per EuroSciVoc field<\u002Fdiv>\n          <sc-for list=\"{{ toolFields }}\" as=\"tf\" hint-placeholder-count=\"5\">\n            <div style=\"margin-bottom:13px;\">\n              <div style=\"display:flex; align-items:center; justify-content:space-between; font-size:12.5px; margin-bottom:6px;\">\n                <span style=\"color:#cdd5ef; font-weight:500;\">{{ tf.label }}<\u002Fspan>\n                <span style=\"color:#8a96c6; font-weight:600; font-variant-numeric:tabular-nums;\">{{ tf.n }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:7px; border-radius:7px; background:rgba(163,174,208,0.08); overflow:hidden;\">\n                <div style=\"height:100%; border-radius:7px; width:{{ tf.w }}%; background:{{ tf.color }};\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n "ERC Advanced Grants\", color: \"#22C55E\", progLabel: \"Horizon Europe\", budget: \"\\u20ac650M\", days: 6, deadline: \"in 6 days\" },\n      { id: \"HORIZON-CL5-2025-D3-02\", title: \"Clean energy transition\", color: \"#22C55E\", progLabel: \"Horizon Europe\", budget: \"\\u20ac95M\", days: 12, deadline: \"in 12 days\" },\n      { id: \"HORIZON-MSCA-2025-PF-01\", title: \"Postdoctoral Fellowships\", color: \"#22C55E\", progLabel: \"Horizon Europe\", budget: \"\\u20ac260M\", days: 18, deadline: \"in 18 days\" },\n      { id: \"DIGITAL-2025-CLOUD-AI-06\", title: \"Cloud-to-edge & AI\", color: \"#60A5FA\", progLabel: \"Digital Europe\", budget: \"\\u20ac84M\", days: 24, deadline: \"in 24 days\" },\n      { id: \"HORIZON-CL1-2025-HLTH-03\", title: \"Health & wellbeing\", color: \"#22C55E\", progLabel: \"Horizon Europe\", budget: \"\\u20ac180M\", days: 29, deadline: \"in 29 days\" },\n      { id: \"HORIZON-CL6-2025-FARM2FORK\", title: \"Farm to Fork systems\", color: \"#22C55E\", progLabel: \"Horizon Europe\", budget: \"\\u20ac110M\", days: 41, deadline: \"in 41 days\" },\n      { id: \"HORIZON-EIC-2025-ACCEL\", title: \"EIC Accelerator\", color: \"#22C55E\", progLabel: \"Horizon Europe\", budget: \"\\u20ac340M\", days: 47, deadline: \"in 47 days\" },\n    ];\n    let visibleCalls = callDefs;\n    if (callFilter === \"closing30\") visibleCalls = callDefs.filter((c) => c.days <= 30);\n    const calls = visibleCalls.map((c) => {\n      const closing = c.days <= 10;\n      return {\n        ...c,\n        glow: tint(c.color, 0.18),\n        statusLabel: closing ? \"Closing\" : \"Open\",\n        statusColor: closing ? \"#FBBF24\" : \"#22C55E\",\n        statusBg: closing ? \"rgba(251,191,36,0.12)\" : \"rgba(34,197,94,0.12)\",\n      };\n    });\n    const filterDefs = [\n      { key: \"all\", label: \"All\" },\n      { key: \"closing30\", label: \"Closing 30d\" },\n    ];\n    const callFilters = filterDefs.map((f) => {\n      const on = callFilter === f.key;\n      return {\n        ...f,\n        onClick: () => this.setState({ callFilter: f.key }),\n        style: `font-family:'DM Sans',sans-serif; font-size:11.5px; font-weight:600; padding:6px 12px; border-radius:9px; cursor:pointer; border:1px solid ${on ? tint(accent, 0.5) : \"rgba(163,174,208,0.12)\"}; color:${on ? \"#fff\" : \"#8a96c6\"}; background:${on ? tint(accent, 0.22) : \"transparent\"};`,\n      };\n    });\n    const callCountLabel = callFilter === \"closing30\" ? calls.length + \" closing within 30 days\" : \"248 open · 17 closing in 30d\";\n\n    // ---- Tool panel\n    const toolDefs = [\n      { key: \"fields\", label: \"Fields\", icon: \"account_tree\" },\n      { key: \"country\", label: \"Country\", icon: \"public\" },\n      { key: \"hopOn\", label: \"Hop-on\", icon: \"group_add\" },\n    ];\n    const toolTabs = toolDefs.map((t) => {\n      const on = toolTab === t.key;\n      return {\n        ...t,\n        onClick: () => this.setState({ toolTab: t.key }),\n        style: `flex:1 1 0; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:600; padding:8px 6px; border-radius:9px; cursor:pointer; border:0; color:${on ? \"#fff\" : \"#7a86b6\"}; background:${on ? `linear-gradient(135deg,${accent},#4318FF)` : \"transparent\"};`,\n      };\n    });\n    const toolFields = [\n      { label: \"Natural sciences\", n: 412, w: 100, color: \"#22C55E\" },\n      { label: \"Engineering & tech\", n: 338, w: 82, color: \"#60A5FA\" },\n      { label: \"Medical & health\", n: 221, w: 54, color: \"#F472B6\" },\n      { label: \"Social sciences\", n: 134, w: 33, color: \"#FBBF24\" },\n      { label: \"Agriculture & food\", n: 96, w: 23, color: \"#22D3EE\" },\n    ];\n    const countryCodes = [\"DE\", \"FR\", \"ES\", \"IT\", \"NL\", \"BE\", \"SE\", \"DK\", \"AT\", \"FI\", \"PL\", \"IE\"];\n    const countryChips = countryCodes.map((code) => {\n      const on = code === \"DK\";\n      return {\n        code,\n        style: `font-family:'DM Sans',sans-serif; font-size:12px; font-weight:600; padding:6px 11px; border-radius:9px; cursor:pointer; color:${on ? \"#fff\" : \"#a3aed0\"}; background:${on ? tint(accent, 0.25) : \"#0d1a40\"}; border:1px solid ${on ? tint(accent, 0.5) : \"rgba(163,174,208,0.1)\"};`,\n      };\n    });\n    const hopon = [\n      { name: \"GREENLOOP\", host: \"TU Delft\", country: \"NL\", started: \"2 mo ago\" },\n      { name: \"NEUROSYNC\", host: \"KU Leuven\", country: \"BE\", started: \"3 mo ago\" },\n      { name: \"AGRIWISE\", host: \"CNR\", country: \"IT\", started: \"1 mo ago\" },\n      { name: \"QUANTLEAP\", host: \"Max Planck\", country: \"DE\", started: \"5 wk ago\" },\n    ];\n\n    // ---- Funding window\n    const fundingTabDefs = [\n      { key: \"planned\", label: \"Planned\" },\n      { key: \"awarded\", label: \"Awarded\" },\n      { key: \"both\", label: \"Both\" },\n    ];\n    const fundingTabs = fundingTabDefs.map((t) => {\n      const on = fundingMode === t.key;\n      return {\n        ...t,\n        onClick: () => this.setState({ fundingMode: t.key }),\n        style: `flex:1 1 0; font-family:'DM Sans',sans-serif; font-size:11.5px; font-weight:600; padding:7px 6px; border-radius:8px; cursor:pointer; border:0; color:${on ? \"#fff\" : \"#7a86b6\"}; background:${on ? `linear-gradient(135deg,${accent},#4318FF)` : \"transparent\"};`,\n      };\n    });\n    const progDefs = [\n      { label: \"Horizon Europe\", color: \"#22C55E\", planned: 8.6, awarded: 31.2 },\n      { label: \"Digital Europe\", color: \"#60A5FA\", planned: 1.8, awarded: 4.1 },\n      { label: \"Connecting Europe\", color: \"#FBBF24\", planned: 1.1, awarded: 2.3 },\n      { label: \"Erasmus+\", color: \"#A78BFA\", planned: 0.6, awarded: 0.9 },\n      { label: \"Euratom\", color: \"#22D3EE\", planned: 0.21, awarded: 0.7 },\n      { label: \"Creative Europe\", color: \"#F472B6\", planned: 0.12, awarded: 0.2 },\n    ];\n    const maxP = Math.max(...progDefs.map((p) => p.planned));\n    const maxA = Math.max(...progDefs.map((p) => p.awarded));\n    const fmtB = (v) => (v >= 1 ? \"\\u20ac\" + v.toFixed(1) + \"B\" : \"\\u20ac\" + Math.round(v * 1000) + \"M\");\n    const showPlanned = fundingMode === \"planned\" || fundingMode === \"both\";\n    const showAwarded = fundingMode === \"awarded\" || fundingMode === \"both\";\n    const sortKey = fundingMode === \"awarded\" ? \"awarded\" : \"planned\";\n    const programmes = [...progDefs]\n      .sort((a, b) => b[sortKey] - a[sortKey])\n      .map((p) => ({\n        label: p.label,\n        color: p.color,\n        showPlanned,\n        showAwarded,\n        plannedW: Math.max((p.planned / maxP) * 100, 2),\n        awardedW: Math.max((p.awarded / maxA) * 100, 2),\n        plannedLabel: fmtB(p.planned),\n        awardedLabel: fmtB(p.awarded),\n        totalLabel: fundingMode === \"awarded\" ? fmtB(p.awarded) + \" awarded\" : fmtB(p.planned) + \" on offer\",\n      }));\n\n    // ---- Calls timeline\n    const tlVals = [12, 18, 24, 31, 28, 42, 38, 30, 46, 52, 40, 33];\n    const tlMonths = [\"Mar\", \"Apr\", \"May\", \"Jun\", \"Jul\", \"Aug\", \"Sep\", \"Oct\", \"Nov\", \"Dec\", \"Jan\", \"Feb\"];\n    const maxTl = Math.max(...tlVals);\n    const timeline = tlVals.map((v, i) => ({ m: tlMonths[i], h: Math.max((v / maxTl) * 100, 6) }));\n\n    // ---- Geography\n    const countryDefs = [\n      { code: \"DE\", name: \"Germany\", projects: 2840, eur: \"\\u20ac7.9B\" },\n      { code: \"FR\", name: \"France\", projects: 2410, eur: \"\\u20ac6.8B\" },\n      { code: \"ES\", name: \"Spain\", projects: 2180, eur: \"\\u20ac5.1B\" },\n      { code: \"IT\", name: \"Italy\", projects: 2060, eur: \"\\u20ac4.9B\" },\n      { code: \"NL\", name: \"Netherlands\", projects: 1490, eur: \"\\u20ac4.2B\" },\n      { code: \"BE\", name: \"Belgium\", projects: 1180, eur: \"\\u20ac3.3B\" },\n      { code: \"SE\", name: \"Sweden\", projects: 760, eur: \"\\u20ac2.1B\" },\n      { code: \"DK\", name: \"Denmark\", projects: 640, eur: \"\\u20ac1.8B\" },\n    ];\n    const maxCo = Math.max(...countryDefs.map((c) => c.projects));\n    const countries = countryDefs.map((c) => ({ ...c, projects: c.projects.toLocaleString(), w: (c.projects / maxCo) * 100 }));\n\n    // ---- Organisations\n    const orgs = [\n      { rank: 1, name: \"CNRS\", country: \"France\", eur: \"\\u20ac1.42B\", share: 100 },\n      { rank: 2, name: \"Fraunhofer\", country: \"Germany\", eur: \"\\u20ac1.18B\", share: 83 },\n      { rank: 3, name: \"CEA\", country: \"France\", eur: \"\\u20ac0.96B\", share: 68 },\n      { rank: 4, name: \"Max Planck\", country: \"Germany\", eur: \"\\u20ac0.89B\", share: 63 },\n      { rank: 5, name: \"CNR\", country: \"Italy\", eur: \"\\u20ac0.74B\", share: 52 },\n      { rank: 6, name: \"KU Leuven\", country: \"Belgium\", eur: \"\\u20ac0.68B\", share: 48 },\n      { rank: 7, name: \"ETH Z\\u00fcrich\", country: \"Switzerland\", eur: \"\\u20ac0.61B\", share: 43 },\n      { rank: 8, name: \"TU Delft\", country: \"Netherlands\", eur: \"\\u20ac0.55B\", share: 39 },\n    ];\n\n    // ---- Fields donut\n    const fieldDefs = [\n      { label: \"Natural sciences\", pct: 34, color: \"#22C55E\" },\n      { label: \"Engineering & technology\", pct: 27, color: \"#60A5FA\" },\n      { label: \"Medical & health sciences\", pct: 18, color: \"#F472B6\" },\n      { label: \"Social sciences\", pct: 11, color: \"#FBBF24\" },\n      { label: \"Agricultural sciences\", pct: 6, color: \"#22D3EE\" },\n      { label: \"Humanities\", pct: 4, color: \"#A78BFA\" },\n    ];\n    let acc = 0;\n    const stops = fieldDefs.map((f) => {\n      const start = acc; acc += f.pct;\n      return `${f.color} ${start * 3.6}deg ${acc * 3.6}deg`;\n    });\n    const fieldDonut = `conic-gradient(${stops.join(\",\")})`;\n\n    // ---- Saved\n    const savedSearches = [\n      { label: \"Climate & energy · open\", count: 42, icon: \"bolt\" },\n      { label: \"AI & digital · closing 30d\", count: 11, icon: \"smart_toy\" },\n      { label: \"Health · MSCA fellowships\", count: 28, icon: \"medical_services\" },\n    ];\n    const savedViews = [\n      { label: \"Denmark partners\", sub: \"Country overlay · DK\", icon: \"public\" },\n      { label: \"My cluster shortlist\", sub: \"8 calls pinned\", icon: \"push_pin\" },\n    ];\n\n    // ---- Funded activity over eras (CORDIS) — replicates CordisActivityTrend\n    const ERA_META = {\n      FP7: { label: \"FP7\", color: \"#a78bfa\" },\n      H2020: { label: \"Horizon 2020\", color: \"#60a5fa\" },\n      HORIZON: { label: \"Horizon Europe\", color: \"#34d399\" },\n    };\n    const ERA_FACTOR = { FP7: 0.73e6, H2020: 0.96e6, HORIZON: 0.95e6 };\n    const yearDefs = [\n      { year: 2007, era: \"FP7\", count: 180 }, { year: 2008, era: \"FP7\", count: 240 },\n      { year: 2009, era: \"FP7\", count: 300 }, { year: 2010, era: \"FP7\", count: 360 },\n      { year: 2011, era: \"FP7\", count: 400 }, { year: 2012, era: \"FP7\", count: 440 },\n      { year: 2013, era: \"FP7\", count: 540 },\n      { year: 2014, era: \"H2020\", count: 760 }, { year: 2015, era: \"H2020\", count: 900 },\n      { year: 2016, era: \"H2020\", count: 1020 }, { year: 2017, era: \"H2020\", count: 1100 },\n      { year: 2018, era: \"H2020\", count: 1180 }, { year: 2019, era: \"H2020\", count: 1100 },\n      { year: 2020, era: \"H2020\", count: 1120 },\n      { year: 2021, era: \"HORIZON\", count: 1280 }, { year: 2022, era: \"HORIZON\", count: 1420 },\n      { year: 2023, era: \"HORIZON\", count: 1380 }, { year: 2024, era: \"HORIZON\", count: 1020 },\n      { year: 2025, era: \"HORIZON\", count: 460 },\n    ];\n    const fundedIsProjects = fundedMeasure === \"projects\";\n    const fmtBudget = (v) => {\n      if (v >= 1e9) return \"\\u20ac\" + (v / 1e9).toFixed(1) + \"B\";\n      if (v >= 1e6) return \"\\u20ac\" + (v / 1e6).toFixed(0) + \"M\";\n      if (v >= 1e3) return \"\\u20ac\" + (v / 1e3).toFixed(0) + \"K\";\n      return v > 0 ? \"\\u20ac\" + v.toLocaleString() : \"\\u2014\";\n    };\n    const yearMetric = (d) => (fundedIsProjects ? d.count : d.count * ERA_FACTOR[d.era]);\n    const maxYearMetric = Math.max(...yearDefs.map(yearMetric), 1);\n    const span = yearDefs.length;\n    const labelStep = span <= 10 ? 1 : Math.ceil(span / 6);\n    const fundedYears = yearDefs.map((d, i) => ({\n      year: d.year,\n      label: i === 0 || i === span - 1 || i % labelStep === 0 ? String(d.year) : \"\",\n      color: ERA_META[d.era].color,\n      h: Math.max((yearMetric(d) / maxYearMetric) * 100, 4),\n      tip: d.year + \" \\u00b7 \" + d.count.toLocaleString() + \" projects \\u00b7 \" + fmtBudget(d.count * ERA_FACTOR[d.era]) + \" \\u00b7 \" + ERA_META[d.era].label,\n    }));\n    const fundedEras = [\"FP7\", \"H2020\", \"HORIZON\"].map((k) => {\n      const items = yearDefs.filter((d) => d.era === k);\n      const total = items.reduce((a, b) => a + b.count, 0);\n      const fund = total * ERA_FACTOR[k];\n      const ys = items.map((d) => d.year);\n      return {\n        label: ERA_META[k].label,\n        color: ERA_META[k].color,\n        span: Math.min(...ys) + \"\\u2013\" + Math.max(...ys),\n        count: total.toLocaleString(),\n        funding: fmtBudget(fund),\n      };\n    });\n    const fundedLegend = fundedEras.map((e) => ({ label: e.label, color: e.color }));\n    const fundedTotal = yearDefs.reduce((a, b) => a + b.count, 0);\n    const fundedTabs = [\n      { key: \"projects\", label: \"Projects\" },\n      { key: \"funding\", label: \"EU funding\" },\n    ].map((t) => {\n      const on = fundedMeasure === t.key;\n      return {\n        ...t,\n        onClick: () => this.setState({ fundedMeasure: t.key }),\n        style: `flex:1 1 0; font-family:'DM Sans',sans-serif; font-size:11.5px; font-weight:600; padding:7px 6px; border-radius:8px; cursor:pointer; border:0; color:${on ? \"#fff\" : \"#7a86b6\"}; background:${on ? `linear-gradient(135deg,${accent},#4318FF)` : \"transparent\"};`,\n      };\n    });\n    const fundedYNote = fundedIsProjects ? \"Funded projects per start year\" : \"EU funding per start year (\\u20ac)\";\n\n    // ---- Calls over time (always-visible) — replicates CallsOverTime\n    const COT_MONTHS = [\"Jan\", \"Feb\", \"Mar\", \"Apr\", \"May\", \"Jun\", \"Jul\", \"Aug\", \"Sep\", \"Oct\", \"Nov\", \"Dec\"];\n    const cotOpen = [18, 24, 30, 42, 38, 52, 60, 48, 66, 72, 54, 40];\n    const cotClosed = [8, 12, 16, 20, 26, 30, 34, 40, 46, 38, 28, 18];\n    const cotVals = cotMode === \"open\" ? cotOpen : cotClosed;\n    const cotMax = Math.max(...cotVals, 1);\n    const padY = 5, usableH = 90;\n    const cotPts = cotVals.map((v, i) => ({\n      x: (i / (cotVals.length - 1)) * 480,\n      y: padY + usableH - (v / cotMax) * usableH,\n    }));\n    const cotLine = cotPts.map((p, i) => `${i === 0 ? \"M\" : \"L\"}${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(\" \");\n    const cotArea = `${cotLine} L${cotPts[cotPts.length - 1].x.toFixed(2)},100 L${cotPts[0].x.toFixed(2)},100 Z`;\n    const cotColor = cotMode === \"open\" ? \"#22C55E\" : \"#F59E0B\";\n    const cotTabs = [\n      { key: \"open\", label: \"Open\", dot: \"#22C55E\" },\n      { key: \"closed\", label: \"Closed\", dot: \"#F59E0B\" },\n    ].map((t) => {\n      const on = cotMode === t.key;\n      return {\n        ...t,\n        onClick: () => this.setState({ cotMode: t.key }),\n        style: `display:inline-flex; align-items:center; gap:6px; font-family:'DM Sans',sans-serif; font-size:11.5px; font-weight:600; padding:6px 11px; border-radius:9px; cursor:pointer; border:1px solid ${on ? tint(accent, 0.5) : \"rgba(163,174,208,0.12)\"}; color:${on ? \"#fff\" : \"#8a96c6\"}; background:${on ? tint(accent, 0.22) : \"transparent\"};`,\n      };\n    });\n\n    // ---- Windows\n    const mkWin = (key) => ({\n      open: !!open[key],\n      left: pos[key].x,\n      top: pos[key].y,\n      z: top === key ? 90 : 60,\n      onDrag: (e) => this.startDrag(key, e),\n      onClose: () => this.close(key),\n      onFocus: () => this.focus(key),\n    });\n    const win = {\n      funding: mkWin(\"funding\"),\n      calls: mkWin(\"calls\"),\n      geography: mkWin(\"geography\"),\n      orgs: mkWin(\"orgs\"),\n      fields: mkWin(\"fields\"),\n      saved: mkWin(\"saved\"),\n      funded: mkWin(\"funded\"),\n    };\n\n    return {\n      accent, dim,\n      kpis, themes,\n      calls, callFilters, callCountLabel,\n      toolTabs,\n      toolIsFields: toolTab === \"fields\",\n      toolIsCountry: toolTab === \"country\",\n      toolIsHopOn: toolTab === \"hopOn\",\n      toolFields, countryChips, hopon,\n      fundingTabs, programmes,\n      timeline,\n      countries, orgs,\n      fields: fieldDefs, fieldDonut,\n      savedSearches, savedViews,\n      fundedYears, fundedEras, fundedLegend, fundedTabs, fundedYNote,\n      fundedSubtitle: fundedTotal.toLocaleString() + \" funded projects \\u00b7 by start year\",\n      fundedSummary: \"Funded activity spans 2007\\u20132025 across 3 EU programmes (FP7 to Horizon Europe). Peak year 2022 (1,420 projects).\",\n      fundedProv: \"CORDIS \\u00b7 EU-funded project participations linked to tracked calls.\",\n      cotLine, cotArea, cotColor, cotTabs, cotMonths: COT_MONTHS,\n      win,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
