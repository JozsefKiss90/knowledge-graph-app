              - paragraph [ref=e116]: Deepened knowledge of specific factors favouring the growth of creative startups [1] , in particular those with potential for disruptive innovation [2] and/or cross-sectorial innovation impacts, is made available and promoted to policymakers, investors, funding- and enterprise support bodies.
              - paragraph [ref=e117]: Effective methods to favour the growth of creative startups, in particular those with potential for disruptive innovation and/or cross-sectorial innovation impacts, are developed, tested and put in practice by industry, investors, funding- and enterprise support bodies, and relevant decision makers.
              - paragraph [ref=e118]: "Examples of creative startups scaling up and/or engaging in disruptive innovation are made available, with a view to increase the visibility and recognition of the innovative power of Europe’s creative startups. In addition, proposals should contribute to at least one of the following expected outcomes, depending on the option chosen (a or b below):"
              - paragraph [ref=e119]: The effectiveness of the methods developed is demonstrated by at least one creative startup supported via the action becoming a scaleup [3] in a Member State or an Associated Country.
              - paragraph [ref=e120]: The effectiveness of the methods developed is demonstrated by at least one creative startup or scaleup supported via the action succeeding in bringing a disruptive innovation to the market.
