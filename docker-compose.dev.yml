# Pin the compose project name so a bare `docker compose -f docker-compose.dev.yml ...`
# always targets the SAME stack + volume (knowledge-graph-app-dev_neo4j_data).
# Without this, an explicit `-p kg-dev` silently creates a SECOND, EMPTY stack and a
# SECOND, EMPTY volume - which is how the graph was lost in July 2026.
# Do NOT pass -p on the command line; just use `docker compose -f docker-compose.dev.yml`.
name: knowledge-graph-app-dev

services:
  neo4j:
    image: neo4j:2026.02.2   # pinned to match neo4j-seed/neo4j.dump + Railway production (was neo4j:latest)
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4JLABS_PLUGINS=["apoc"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - dbms.security.procedures.unrestricted=apoc.*
      - dbms.security.procedures.allowlist=apoc.*
    volumes:
      - neo4j_data:/data

  backend:
    build:
      context: ./backend
      dockerfile:  Dockerfile.backend.dev
    volumes:
      - ./backend:/app
      - ./pdf_files:/pdf_files
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    env_file:
      - ./frontend/.env.frontend.development
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - FAST_REFRESH=true
      - WDS_SOCKET_PORT=3001

volumes:
  neo4j_data: {} #we have to use bracktets here to avoid a warning
